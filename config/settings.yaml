project:
  name: quant_system
  version: 1.0.0
  description: 量化交易系统
data:
  source: tushare
  adjust_mode: ''
  raw_price_adjust: hfq
  stock_file: ./data/ZZ_1000.txt
  cache_dir: ./data/raw
  processed_dir: ./data/processed
indicator_cache:
  enabled: true
  dir: ./data/processed/indicators
backtest:
  start_date: '2015-01-01'
  end_date: '2025-12-31'
  initial_capital: 500000.0
  trade_amount: 10000.0
  commission_rate: 0.0003
  slippage: 0.0001
  min_commission: 5.0
  stamp_duty_rate: 0.0005
  trade_constraints:
    enforce_lot_size: true
    lot_size: 1
    enable_t1: true
    block_suspended: true
    block_limit_up: true
    block_limit_down: true
    limit_pct: 0.1
    st_limit_pct: 0.05
    limit_pct_by_prefix:
      '300': 0.2
      '301': 0.2
      '688': 0.2
      '4': 0.3
      '8': 0.3
strategy:
  rebalance_freq: monthly
  max_position_pct: 0.05
  min_position_pct: 0.01
live_backtest:
  universe_type: stock
  industry_index_codes: []
  stock_max_number: -1
  max_workers: 4
  signal_workers: 4
  selected_strategies:
  - bollinger_squeeze
  signal_combination: weighted
  signal_threshold: 0.5
  signal_weights:
    bollinger_squeeze: 1.0
  enable_stop_loss: true
  enable_stop_profit: true
